services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on: [zookeeper]
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: HOST://0.0.0.0:9092,DOCKER://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 6        # parallelism for downstream consumers

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: insights
      MINIO_ROOT_PASSWORD: insights-local
    volumes:
      - minio-data:/data

  notebook:
    build:
      context: .
      dockerfile: docker/notebook.Dockerfile
    depends_on:
      - kafka
      - minio
    ports:
      - "127.0.0.1:8888:8888"
    environment: &lakehouse-environment
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: insights
      MINIO_SECRET_KEY: insights-local
      MINIO_BUCKET: insightsstream
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - .:/workspace

  dashboard:
    build:
      context: .
      dockerfile: docker/notebook.Dockerfile
    depends_on:
      - minio
    command: python -m streamlit run dashboard/delta_app.py --server.address=0.0.0.0
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8501}:8501"
    environment: *lakehouse-environment
    volumes:
      - .:/workspace

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: insights
      POSTGRES_PASSWORD: insights
      POSTGRES_DB: insights
    volumes:
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./api
    depends_on: [postgres, redis]
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000

volumes:
  minio-data:
